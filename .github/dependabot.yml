version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
        applies-to: version-updates
      all-actions-security:
        patterns:
          - "*"
        applies-to: security-updates
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-python:
        patterns:
          - "*"
        applies-to: version-updates
      all-python-security:
        patterns:
          - "*"
        applies-to: security-updates
    cooldown:
      default-days: 7
