---
name: Docker Build Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v7.6.0

    - name: Run tests
      run: uv run pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    # The buildkit image is pulled through Google's mirror: the default
    # Docker Hub path is throttled (429) on shared hosted-runner IPs.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Build Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: closing-labels:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test — entrypoint exits non-zero on missing env
      run: |
        output=$(docker run --rm closing-labels:test 2>&1 || true)
        echo "$output"
        echo "$output" | grep -q "INPUT_OWNER is not set"

    - name: End-to-end dry-run against fixture PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        docker run --rm \
          -e GH_TOKEN \
          -e INPUT_OWNER=williambdean \
          -e INPUT_REPO=closing-labels \
          -e INPUT_PR_NUMBER=21 \
          -e INPUT_DRY_RUN=true \
          closing-labels:test
