---
name: Bot PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label-no-releasenotes:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Label no releasenotes
        run: |
          number=${{ github.event.pull_request.number }}
          is_bot=$(gh pr view $number --json author --jq '.author.is_bot')
          if [[ $is_bot == "true" ]]; then
            gh pr edit $number --add-label "no releasenotes"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  auto-merge-bot-prs:
    permissions:
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    # Dependabot only: user.type == 'Bot' would also merge any other
    # bot account, and this grants write permissions on the repo.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Auto-merge PR
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
